<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #000; color: white; overflow-x: hidden; user-select: none; -webkit-user-select: none; }
        .header { background: #000; padding: 15px; text-align: center; border-bottom: 3px solid red; }
        .header h1 { font-size: 28px; color: white; text-shadow: 0 0 10px red; }
        .player-box { position: relative; width: 100%; background: black; }
        video { width: 100%; height: 250px; background: black; object-fit: contain; }
        .fb-container { padding: 25px; text-align: center; }
        
        /* */
        .fb-btn { 
            display: inline-flex; 
            align-items: center; 
            gap: 12px; 
            padding: 14px 28px; 
            background: linear-gradient(135deg, #1877F2, #0A52B6); 
            color: white; 
            text-decoration: none; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 50px; 
            box-shadow: 0 4px 15px rgba(24, 119, 242, 0.4); 
            transition: all 0.3s ease; 
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .fb-btn:hover { 
            transform: scale(1.05); 
            box-shadow: 0 0 25px rgba(24, 119, 242, 0.8); 
        }
        /*  */
        .fb-icon {
            width: 22px;
            height: 22px;
            fill: white;
        }
        .channel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 14px; }
        .channel { background: white; border-radius: 20px; padding: 10px; height: 100px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid cyan; }
        .footer { text-align: center; padding: 20px; color: gray; font-size: 14px; }
    </style>
</head>
<body>

    <!--  -->
    <div class="header"><h1 id="titleDisplay">Loading...</h1></div>

    <div class="player-box">
        <video id="video" autoplay controls controlsList="nodownload" oncontextmenu="return false;"></video>
    </div>

    <!--  -->
    <div class="fb-container">
        <a id="fbBtn" href="#" class="fb-btn">
            <svg class="fb-icon" viewBox="0 0 24 24">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            <span id="btnText">Connect</span>
        </a>
    </div>

    <div class="channel-grid" id="channelGrid"></div>

    <div class="footer" id="footerDisplay"></div>

    <script type="text/javascript">
    // 
    const _0x7a3c = {
        n: atob('TWFuc2liIFNpa2Rlcg=='), // 
        l: atob('aHR0cHM6Ly93d3cuZmFjZWJvb2suY29tL3Byb2ZpbGUucGhwP2lkPTYxNTc2NzE0NzA1ODc3'), // 
        t: "Rm9sbG93IE1lIG9uIEZhY2Vib29r"
    };

    // 
    document.getElementById('titleDisplay').innerText = _0x7a3c.n;
    document.getElementById('footerDisplay').innerHTML = `&copy; 2026 <span>${_0x7a3c.n}</span> | `;
    document.getElementById('fbBtn').href = _0x7a3c.l;
    document.getElementById('btnText').innerText = atob(_0x7a3c.t);

    // 
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = function(e) {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 67 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
            return false;
        }
    };
    setInterval(function(){ debugger; }, 50);

    //
    const playlist = 'https://raw.githubusercontent.com/Rakib49/Rakibiptv/refs/heads/main/aynaott.m3u';
    let channels = [];
    
    fetch(playlist).then(res => res.text()).then(data => {
        const lines = data.split('\n');
        for(let i=0; i<lines.length; i++){
            if(lines[i].startsWith('#EXTINF')){
                const url = lines[i+1]?.trim();
                const logoMatch = lines[i].match(/tvg-logo="(.*?)"/);
                if(url && url.startsWith('http')) channels.push({ url, logo: logoMatch ? logoMatch[1] : '' });
            }
        }
        const grid = document.getElementById('channelGrid');
        channels.forEach((ch, index) => {
            const div = document.createElement('div');
            div.className = 'channel';
            div.innerHTML = `<img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/100'" style="width:100%;height:100%;object-fit:contain;">`;
            div.onclick = () => {
                const video = document.getElementById('video');
                if(Hls.isSupported()){
                    const hls = new Hls();
                    hls.loadSource(channels[index].url);
                    hls.attachMedia(video);
                }
            };
            grid.appendChild(div);
        });
    });
    </script>
</body>
</html>

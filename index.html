<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="appTitle">...</title>
    
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    
    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        :root {
            --primary: #ff0000;
            --bg-dark: #09090c;
            --bg-card: #16161f;
            --text-main: #ffffff;
            --text-glow: rgba(255, 0, 0, 0.6);
            --fb-color: #1877f2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; user-select: none; -webkit-user-select: none; padding-bottom: 90px; }

        /* Cinematic Header */
        .welcome-header {
            width: 100%;
            padding: 20px 15px;
            background: linear-gradient(135deg, #111116 0%, #1a0000 100%);
            border-bottom: 2px solid #250303;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .welcome-title { font-size: 26px; font-weight: 800; color: #fff; text-transform: uppercase; }
        .welcome-sub {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            background: rgba(255, 0, 0, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 0, 0, 0.3);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 0 8px var(--text-glow);
            margin-top: 4px;
        }

        /* Sticky Video Player */
        .video-sticky-box {
            position: sticky;
            top: 0;
            z-index: 999;
            width: 100%;
            background: #000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.9);
        }
        .player-wrapper { position: relative; width: 100%; height: 220px; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; display: block; }

        /* Toolbar */
        .player-tools {
            background: #111116;
            padding: 12px 15px;
            border-bottom: 2px solid #1f1f2e;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .fb-tool-btn {
            flex: 1;
            background: var(--fb-color);
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(24, 119, 242, 0.3);
        }
        
        /* Comment Icon Button */
        .comment-icon-btn {
            width: 44px;
            height: 44px;
            background: #1c1c27;
            border: 1px solid #2c2c3e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 18px;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .comment-icon-btn:hover { border-color: var(--primary); color: var(--primary); }

        /* Search Bar */
        .search-container { padding: 15px 15px 5px 15px; }
        .search-box { position: relative; width: 100%; }
        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            background: #16161f;
            border: 1px solid #2c2c3e;
            border-radius: 20px;
            color: white;
            font-size: 13px;
            outline: none;
            transition: 0.3s;
        }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(255, 0, 0, 0.2); }
        .search-box .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 14px; color: #888; }

        /* Category Filter Menu */
        .category-wrapper { display: flex; gap: 10px; overflow-x: auto; padding: 10px 15px 15px 15px; }
        .category-wrapper::-webkit-scrollbar { display: none; }
        .cat-item { padding: 8px 18px; background: #1c1c27; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; border: 1px solid #2c2c3e; color: #ccc; }
        .cat-item.active { background: var(--primary); border-color: var(--primary); color: white; box-shadow: 0 0 10px var(--text-glow); }

        /* Cinematic Poster Banner Slider */
        .hero-slider-section { padding: 10px 0 5px 0; }
        .slider-title { font-size: 15px; font-weight: bold; padding-left: 15px; margin-bottom: 10px; color: #e6e6e6; }
        .banner-slider { display: flex; gap: 12px; overflow-x: auto; padding: 0 15px 10px 15px; scroll-behavior: smooth; }
        .banner-slider::-webkit-scrollbar { display: none; }
        
        .poster-card {
            min-width: 125px;
            height: 170px;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 1.5px solid #232335;
            transition: 0.3s;
        }
        .poster-card img { width: 100%; height: 100%; object-fit: cover; }
        .poster-card.fb-card { border-color: var(--fb-color); }
        .poster-overlay { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); padding: 8px; text-align: center; font-size: 10px; font-weight: bold; }

        /* Grid Channel List */
        .section-heading { font-size: 15px; font-weight: bold; padding: 5px 15px; color: #b3b3b3; }
        .channels-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 15px; min-height: 100px; }
        .channel-thumb { background: var(--bg-card); border-radius: 14px; padding: 12px; height: 90px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #1f1f2e; transition: 0.2s; }
        .channel-thumb:hover { border-color: var(--primary); }
        .channel-thumb img { width: 100%; height: 100%; object-fit: contain; }
        .no-results { grid-column: span 3; text-align: center; color: #888; padding: 20px; font-size: 13px; }

        /* Popup Comment Box */
        .comment-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: #111116;
            border: 1px solid #2c2c3e;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: popIn 0.3s ease;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 16px; font-weight: bold; }
        .close-modal-btn { background: none; border: none; color: #888; font-size: 20px; cursor: pointer; }
        .comment-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .comment-input-name { padding: 10px 15px; background: #16161f; border: 1px solid #2c2c3e; border-radius: 8px; color: white; font-size: 13px; outline: none; }
        .comment-input-text { padding: 12px 15px; background: #16161f; border: 1px solid #2c2c3e; border-radius: 8px; color: white; font-size: 13px; outline: none; resize: none; height: 75px; }
        .comment-input-name:focus, .comment-input-text:focus { border-color: var(--primary); }
        .comment-submit-btn { background: var(--primary); color: white; border: none; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
        
        .comments-display-list { display: flex; flex-direction: column; gap: 10px; max-height: 180px; overflow-y: auto; }
        .comments-display-list::-webkit-scrollbar { width: 4px; }
        .comments-display-list::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        .single-comment { background: #16161f; padding: 10px; border-radius: 8px; border-left: 3px solid var(--primary); }
        .comment-meta { display: flex; justify-content: space-between; font-size: 10px; color: #888; margin-bottom: 3px; }
        .comment-user { color: #fff; font-weight: bold; }
        .comment-content { font-size: 12px; color: #ddd; word-break: break-word; }
        .no-comments-yet { text-align: center; color: #555; font-size: 12px; padding: 10px; }

        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* PWA Download Banner Popup */
        .pwa-custom-banner {
            position: fixed;
            bottom: 20px;
            left: 5%;
            right: 5%;
            width: 90%;
            max-width: 500px;
            margin: 0 auto;
            background: linear-gradient(180deg, #bd0000 0%, #7a0000 100%);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            padding: 12px 20px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5), 0 8px 25px rgba(0, 0, 0, 0.8);
            display: none; 
            align-items: center;
            gap: 15px;
            cursor: pointer;
            z-index: 100000;
            animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .pwa-banner-icon { font-size: 28px; display: flex; align-items: center; justify-content: center; }
        .pwa-banner-text-box { display: flex; flex-direction: column; justify-content: center; flex: 1; }
        .pwa-banner-main-title { font-size: 16px; font-weight: 800; color: #ffffff; letter-spacing: 0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); margin-bottom: 2px; }
        .pwa-banner-sub-title { font-size: 11px; font-weight: 600; color: rgba(255, 255, 255, 0.85); }

        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <!-- Cinematic Welcome Header -->
    <div class="welcome-header">
        <span class="welcome-title">Welcome</span>
        <span class="welcome-sub" id="brandName">...</span>
    </div>

    <!-- Sticky Video Player and Toolbar -->
    <div class="video-sticky-box">
        <div class="player-wrapper" id="playerContainer">
            <video id="video" autoplay controls controlsList="nodownload" oncontextmenu="return false;" playsinline webkit-playsinline></video>
        </div>
        <div class="player-tools">
            <a href="#" id="fbSecureLink" target="_blank" class="fb-tool-btn">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c4.56-.93 8-4.96 8-9.8z"/></svg>
                Follow Me on Facebook
            </a>
            <button class="comment-icon-btn" onclick="toggleCommentModal(true)" title="Feedback">💬</button>
        </div>
    </div>

    <!-- Featured Slider -->
    <div class="hero-slider-section">
        <div class="slider-title">🔥 Featured Channels</div>
        <div class="banner-slider" id="bannerSlider">
            <div class="poster-card fb-card" onclick="openFacebook()">
                <img src="https://img.icons8.com/fluent/150/000000/facebook-new.png" alt="Facebook">
                <div class="poster-overlay" id="fbCardName" style="color: #1877f2;">...</div>
            </div>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search channel name..." oninput="filterChannels()">
        </div>
    </div>

    <!-- Category Bar -->
    <div class="category-wrapper">
        <div class="cat-item active" onclick="selectCategory('all', this)">All Channels</div>
        <div class="cat-item" onclick="selectCategory('sports', this)">Sports</div>
        <div class="cat-item" onclick="selectCategory('ent', this)">Entertainment</div>
        <div class="cat-item" onclick="selectCategory('news', this)">News</div>
    </div>

    <!-- Channel Grid List -->
    <div class="section-heading" id="gridTitle">All Live TV Channels</div>
    <div class="channels-grid" id="channelGrid"></div>

    <!-- Popup Comment Box -->
    <div class="comment-modal" id="commentModal" onclick="closeModalOutside(event)">
        <div class="modal-content" id="modalContent">
            <div class="modal-header">
                <span>💬 Feedback & Comments</span>
                <button class="close-modal-btn" onclick="toggleCommentModal(false)">✕</button>
            </div>
            
            <div class="comment-form">
                <input type="text" id="commenterName" class="comment-input-name" placeholder="Your name..." maxlength="25">
                <textarea id="commentText" class="comment-input-text" placeholder="Type your comment..." maxlength="150"></textarea>
                <button class="comment-submit-btn" onclick="submitTvComment()">Post Comment</button>
            </div>

            <div class="comments-display-list" id="modalCommentsList">
                <div class="no-comments-yet">No comments yet!</div>
            </div>
        </div>
    </div>

    <!-- PWA Download Banner Popup -->
    <div id="pwaBanner" class="pwa-custom-banner" onclick="installApp()">
        <div class="pwa-banner-icon">📱</div>
        <div class="pwa-banner-text-box">
            <div class="pwa-banner-main-title">Download TV App!</div>
            <div class="pwa-banner-sub-title">Click here to install for easy access</div>
        </div>
    </div>

    <script type="text/javascript">
    // 🔒 Obfuscated High-Security Database
    const _0xec23 = [
        "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL1Jha2liNDkvUmFraWJpcHR2L3JlZnMvaGVhZHMvbWFpbi9heW5hb3R0Lm0zdQ==", // M3U Playlist URL
        "YUhSMGNITTZMeT d3ZDI1bVlXTmxZbT l1YTNNdVkyOXRMbU52YlM5d2NtOW1hV3hsTG5Cc2NHOXpZMjl1TVE9PQ==", // FB Dynamic Double layer
        "TWFuc2liIFNpa2RlciBUViB8IE9UVCBQbGF0Zm9ybQ==", // App Title
        "TUFOU0lCIFNJS0RFUg==", // Brand Name
        "TUFOU0lCIFNJS0RFUg==" // Card Name Text
    ];

    // Secure Decryption Routine
    const playlistUrl = atob(_0xec23[0]);
    const fbRaw = atob(_0xec23[1].replace(/\s/g, ''));
    const facebookUrl = atob(fbRaw);
    
    // Direct Text Lock Injection
    document.getElementById('appTitle').innerText = atob(_0xec23[2]);
    document.getElementById('brandName').innerText = atob(_0xec23[3]);
    document.getElementById('fbCardName').innerText = atob(_0xec23[4]);
    document.getElementById('fbSecureLink').href = facebookUrl;

    let channels = [];
    let hlsPlayer = null;
    let deferredPrompt = null;
    let currentCategory = 'all';

    function openFacebook() {
        window.open(facebookUrl, '_blank');
    }

    // XSS Protection Function
    function cleanInput(str) {
        return str.replace(/[^\w\s\u0980-\u09FF\d\.\:\-\_\@\?\!\(\)💬👤🕒]/gi, '');
    }

    window.onload = () => {
        fetch(playlistUrl).then(res => res.text()).then(data => {
            const lines = data.split('\n');
            let currentName = '';
            let currentGroup = '';
            
            for(let i=0; i<lines.length; i++){
                if(lines[i].startsWith('#EXTINF')){
                    const nameMatch = lines[i].match(/,(.*)$/);
                    currentName = nameMatch ? nameMatch[1].trim() : 'Live TV';
                    
                    const logoMatch = lines[i].match(/tvg-logo="(.*?)"/);
                    const groupMatch = lines[i].match(/group-title="(.*?)"/);
                    currentGroup = groupMatch ? groupMatch[1].toLowerCase() : '';
                    
                    const url = lines[i+1]?.trim();
                    
                    if(url && url.startsWith('http')){
                        channels.push({ 
                            name: currentName,
                            url: url, 
                            logo: logoMatch ? logoMatch[1] : 'https://via.placeholder.com/150?text=TV',
                            group: currentGroup
                        });
                    }
                }
            }
            renderUI();
            if(channels.length > 0) playChannel(0);
        }).catch(err => console.log("Init protection active."));
        loadModalComments();
    };

    function toggleCommentModal(show) {
        document.getElementById('commentModal').style.display = show ? 'flex' : 'none';
    }

    function closeModalOutside(e) {
        if (e.target.id === 'commentModal') toggleCommentModal(false);
    }

    function submitTvComment() {
        const nameInput = document.getElementById('commenterName');
        const textInput = document.getElementById('commentText');
        const name = cleanInput(nameInput.value.trim());
        const text = cleanInput(textInput.value.trim());
        
        if (!name || !text) {
            alert('Please enter a valid name and comment!');
            return;
        }

        const commentObj = {
            id: Date.now(),
            user: name,
            content: text,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        let comments = JSON.parse(localStorage.getItem('popup_tv_comments')) || [];
        comments.unshift(commentObj);
        localStorage.setItem('popup_tv_comments', JSON.stringify(comments));

        textInput.value = '';
        renderModalComments(comments);
    }

    function loadModalComments() {
        let comments = JSON.parse(localStorage.getItem('popup_tv_comments')) || [];
        renderModalComments(comments);
    }

    function renderModalComments(comments) {
        const container = document.getElementById('modalCommentsList');
        if (comments.length === 0) {
            container.innerHTML = `<div class="no-comments-yet">No comments yet!</div>`;
            return;
        }
        container.innerHTML = '';
        comments.forEach(c => {
            const div = document.createElement('div');
            div.className = 'single-comment';
            div.innerHTML = `
                <div class="comment-meta">
                    <span class="comment-user">👤 ${escapeHTML(c.user)}</span>
                    <span>🕒 ${c.time}</span>
                </div>
                <div class="comment-content">${escapeHTML(c.content)}</div>
            `;
            container.appendChild(div);
        });
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    function selectCategory(cat, element) {
        document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        currentCategory = cat;
        filterChannels();
    }

    function filterChannels() {
        const query = cleanInput(document.getElementById('searchInput').value.toLowerCase().trim());
        const grid = document.getElementById('channelGrid');
        grid.innerHTML = '';

        let filtered = channels.filter(ch => {
            const matchesSearch = ch.name.toLowerCase().includes(query);
            let matchesCategory = false;
            
            if (currentCategory === 'all') {
                matchesCategory = true;
            } else if (currentCategory === 'sports') {
                matchesCategory = ch.group.includes('sports') || ch.group.includes('sport') || ch.group.includes('খেলা') || ch.name.toLowerCase().includes('t sports') || ch.name.toLowerCase().includes('gazi') || ch.name.toLowerCase().includes('sony') || ch.name.toLowerCase().includes('star sports');
            } else if (currentCategory === 'ent') {
                matchesCategory = ch.group.includes('entertainment') || ch.group.includes('movies') || ch.group.includes('বিনোদন') || ch.group.includes('music') || ch.name.toLowerCase().includes('zee') || ch.name.toLowerCase().includes('star jalsha') || ch.name.toLowerCase().includes('sony');
            } else if (currentCategory === 'news') {
                matchesCategory = ch.group.includes('news') || ch.group.includes('খবর') || ch.name.toLowerCase().includes('somoy') || ch.name.toLowerCase().includes('jamuna');
            }
            return matchesSearch && matchesCategory;
        });

        if(filtered.length === 0) {
            grid.innerHTML = `<div class="no-results">No channels found!</div>`;
            return;
        }

        filtered.forEach((ch) => {
            const originalIndex = channels.findIndex(c => c.url === ch.url);
            const thumb = document.createElement('div');
            thumb.className = 'channel-thumb';
            thumb.innerHTML = `<img src="${escapeHTML(ch.logo)}" onerror="this.src='https://via.placeholder.com/100?text=${encodeURIComponent(ch.name)}'">`;
            thumb.onclick = () => playChannel(originalIndex);
            grid.appendChild(thumb);
        });
    }

    function renderUI() {
        const slider = document.getElementById('bannerSlider');
        channels.slice(0, 8).forEach((ch, index) => {
            const poster = document.createElement('div');
            poster.className = 'poster-card';
            poster.innerHTML = `<img src="${escapeHTML(ch.logo)}" onerror="this.src='https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=500'"><div class="poster-overlay">${escapeHTML(ch.name)}</div>`;
            poster.onclick = () => playChannel(index);
            slider.appendChild(poster);
        });
        filterChannels();
    }

    function playChannel(index){
        const video = document.getElementById('video');
        if(hlsPlayer) { hlsPlayer.destroy(); }

        if(Hls.isSupported()){
            hlsPlayer = new Hls({ maxBufferLength: 15 });
            hlsPlayer.loadSource(channels[index].url);
            hlsPlayer.attachMedia(video);
            hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(() => {});
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = channels[index].url;
        }
    }

    /* PWA Download Logic */
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('pwaBanner').style.display = 'flex';
    });

    function installApp() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                document.getElementById('pwaBanner').style.display = 'none';
                deferredPrompt = null;
            });
        }
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Secured.'))
                .catch(err => {});
        });
    }

    // Inspect Lock Protocol
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = function(e) {
        if (e.keyCode == 123 || 
            (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || 
            (e.ctrlKey && e.keyCode == 85)) {
            return false;
        }
    };
    </script>
</body>
</html>
